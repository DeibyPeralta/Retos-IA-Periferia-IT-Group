<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes de Compra SAP</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #eef2f7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(860px, calc(100vw - 32px)); height: 90vh; background: white; border-radius: 16px; box-shadow: 0 12px 40px #8a98aa33; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 18px 22px; border-bottom: 1px solid #e6ebf2; }
    h1 { font-size: 20px; margin: 0; } #messages { overflow-y: auto; padding: 20px; }
    .message { max-width: 78%; padding: 11px 14px; border-radius: 12px; margin: 8px 0; white-space: pre-wrap; }
    .user { margin-left: auto; background: #1769e0; color: white; } .assistant { background: #edf2f8; }
    .tool { background: #fff8df; border: 1px solid #eadb96; font-family: monospace; font-size: 12px; max-width: 94%; }
    .confirmation { border: 2px solid #d97706; background: #fff7ed; }
    form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #e6ebf2; }
    input { flex: 1; border: 1px solid #cbd5e1; border-radius: 9px; padding: 12px; font-size: 15px; }
    button { border: 0; border-radius: 9px; background: #1769e0; color: white; padding: 0 18px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <header><h1>Órdenes de Compra SAP</h1></header>
    <div id="messages"></div>
    <form id="form"><input id="input" placeholder='Ej: Procesa la solicitud "sol-004"' autocomplete="off"><button>Enviar</button></form>
  </main>
  <script>
    const sessionId = crypto.randomUUID();
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    function add(text, kind) {
      const div = document.createElement("div");
      div.className = `message ${kind}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      add(message, "user");
      const thinking = add("Pensando…", "assistant");
      try {
        const response = await fetch("/api/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({sessionId, message}) });
        const data = await response.json();
        thinking.remove();
        for (const call of data.toolCalls ?? []) add(`Herramienta: ${call.name}\nArgumentos: ${JSON.stringify(call.args)}\nResultado: ${JSON.stringify(call.result).slice(0, 600)}`, "tool");
        add(data.reply, data.needsConfirmation ? "assistant confirmation" : "assistant");
      } catch (error) {
        thinking.remove();
        add("No fue posible contactar al servidor.", "assistant");
      }
    });
  </script>
</body>
</html>
